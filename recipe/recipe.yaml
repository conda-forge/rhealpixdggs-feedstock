context:
  name: rhealpixdggs
  version: "0.8.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ec8009d53e279f7a8357f17d3ab02c10af309d67d5a8cf15ac91ce4ed5f7b668

build:
  noarch: python
  script:
    - python -m pip install . --no-deps -vv
  number: 0

requirements:
  host:
    - python ==${{ python_min }}
    - poetry-core >=2.0,<3.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2.0
    - scipy >=1.11
    - pyproj >=3.6
    - shapely >=2.1

tests:
  - python:
      imports:
        - rhealpixdggs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest discover tests/
      - pytest -v --doctest-glob=introduction.rst docs/source/
      - pytest -v --doctest-modules rhealpixdggs -k "not rhealpixdggs.projection_wrapper.Projection"
    requirements:
      run:
        - pytest
        - python ==${{ python_min }}
    files:
      source:
        - tests/
        - docs/
        - rhealpixdggs/

about:
  homepage: "https://github.com/manaakiwhenua/rhealpixdggs-py"
  repository: "https://github.com/manaakiwhenua/rhealpixdggs-py"
  summary: An implementation of the rHEALPix discrete global grid system
  license: LGPL-3.0-or-later OR MIT
  license_file:
    - LICENSE
    - LICENSE-LGPL
    - LICENSE-MIT

extra:
  recipe-maintainers:
    - alpha-beta-soup
  tags:
    - rhealpix
    - DGGS
    - Discrete Global Grid System
    - geospatial
    - spatial
    - reference system
